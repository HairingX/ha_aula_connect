# Not a package: Home Assistant loads the integration from custom_components/. This file holds
# the settings of the tools the repository is checked with.

[tool.pytest.ini_options]
# pytest-homeassistant-custom-component runs every async test in Home Assistant's own loop.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs a real Aula account; skipped unless one is configured"]

[tool.pyright]
# The standard belongs to the repository, not to a personal editor setting: an IDE and a CI
# run must agree on what counts as an error.
include = ["custom_components", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
# A "# type: ignore" hides an error, which the conventions do not allow.
enableTypeIgnoreComments = false
# Not yet checked, during the transition below; each pull request takes files off this list.
ignore = [
    "custom_components/aula_connect/calendar.py",
    "custom_components/aula_connect/config_flow.py",
    "custom_components/aula_connect/views.py",
]

[tool.hairingx-workflows]
transition = """The integration starts from the Aula integration, written before the shared \
standard: its config flow, views and entities are typed and tested module by module."""
# The coverage the tests reach now; each pull request raises it, until it is 100.
coverage = 45
libraries = ["aula_connect"]
