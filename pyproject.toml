# Not a package: Home Assistant loads the integration from custom_components/. This file holds
# the settings of the tools the repository is checked with.

[tool.pytest.ini_options]
# pytest-homeassistant runs every async test in Home Assistant's own loop.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Home Assistant installs its httpx alias before respx is imported; the harness's own HTTP
# mocks use respx directly.
addopts = "-p no:respx"
# custom_components/ is imported from the repository's root.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: needs a real Aula account; skipped unless one is configured"]

[tool.pyright]
# The standard belongs to the repository, not to a personal editor setting: an IDE and a CI
# run must agree on what counts as an error.
include = ["custom_components", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
# A "# type: ignore" hides an error, which the conventions do not allow.
enableTypeIgnoreComments = false

[tool.hairingx-workflows]
libraries = ["mitid_connect", "aula_connect"]
