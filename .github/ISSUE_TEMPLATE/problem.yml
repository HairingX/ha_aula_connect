name: Problem report
description: Something does not work as it should, or an idea for Aula Connect.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Search the
        [open issues](https://github.com/HairingX/ha_aula_connect/issues?q=is%3Aissue+is%3Aopen)
        first; if your problem is there, add a thumbs-up and anything it does not say yet.
        For a repair notice from Aula Connect, use the form **Aula sends something new** instead.
        Danish is fine.
  - type: checkboxes
    attributes:
      label: Searched
      options:
        - label: I searched the open issues, and none is about my problem.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of Aula Connect
      placeholder: "0.0.8"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Version of Home Assistant
      placeholder: "2026.10.4"
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Your account
      options:
        - label: I have more than one child in Aula.
        - label: My children attend different schools or institutions.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Add this to configuration.yaml, restart Home Assistant, make the problem happen, and paste
        the lines of Aula Connect from Settings > System > Logs. No token or credential is ever
        logged; read the lines through all the same.
        ```yaml
        logger:
          default: info
          logs:
            custom_components.aula_connect: debug
            aula_connect: debug
        ```
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Optional, but they help with most problems. Read them through before you attach them:
        [how](https://github.com/HairingX/ha_aula_connect/blob/main/CONTRIBUTING.md#downloading-the-diagnostics).
