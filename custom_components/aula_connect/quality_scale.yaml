rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      The actions are registered in async_setup, and each checks that its entry is loaded. Those
      that change Aula are sent once, on the call only.
  appropriate-polling:
    status: done
    comment: >-
      The data coordinator polls every 5 minutes, reading the way each child is reported sick
      once an hour; the calendar coordinator every 10 minutes, fetching birthdays daily and
      events, weekly plans and newsletters every 2 hours. A write to Aula is never sent from a
      poll, and never retried.
  brands:
    status: done
    comment: Its own icon and logo, shipped in brand/, which Home Assistant serves for custom integrations.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: >-
      The tests cover every line of the config flow: setup, logging in again, reconfiguring, a
      failed login, and an account or name already set up.
  config-flow:
    status: todo
    comment: >-
      Setup is a config flow, but its fields have no data_description.
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: >-
      Calendars, the school day entities and the homework lists register with their coordinator
      in async_added_to_hass and unregister in async_will_remove_from_hass.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The flow completes the MitID login and only creates the entry with its tokens.
  test-before-setup:
    status: done
    comment: >-
      The first refresh checks the connection and raises ConfigEntryAuthFailed on refused
      credentials; other failures make setup retry.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      A part of Aula read twice in a row without success makes the entities that show it
      unavailable, and the presence sensors are unavailable without a daily overview for their
      child.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: The tests cover every line of the integration; the build fails below 100%.

  # Gold
  devices:
    status: done
    comment: >-
      A device for the login, and under it a child device for each child at each institution
      Aula lists it at, named by the child's first name and the institution's name; the entities
      of a child at an institution are on its device.
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: A cloud service has nothing on the network to discover.
  discovery:
    status: exempt
    comment: A cloud service has nothing on the network to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration connects to the Aula service, not to devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      A child Aula lists at a new institution gets its device and entities at the next read of
      the data coordinator, without a reload. The login's own entities, the parents' calendars
      among them, are on the login's device and set up with the entry.
  entity-category:
    status: done
    comment: Every entity is primary data; none is configuration or diagnostic.
  entity-device-class:
    status: done
    comment: >-
      Sensors use the enum, duration and timestamp device classes; no binary sensor device class
      fits an unread item, a school day or a vacation request, and no event device class fits a
      message, photo or calendar event.
  entity-disabled-by-default:
    status: todo
    comment: No entity is disabled by default, and which are rarely used has not been assessed.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: todo
    comment: >-
      The child's picture, homework, school day, vacation request and event entities and the
      actions take their icons from icons.json; the older sensors and binary sensors still set
      theirs in code through _attr_icon, as it follows their state.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      After each read of the login, the device of a child Aula no longer lists at an institution
      is removed with its entities, unless the user disabled it; a disabled one, left out of
      every read on purpose, is kept, and async_remove_config_entry_device lets the user delete
      it once Aula no longer lists the child. The login's device goes with the entry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: >-
      Each entry and each login gets a session of its own from async_create_clientsession, as
      Aula's and MitID's cookies are the login's.
  strict-typing: done
