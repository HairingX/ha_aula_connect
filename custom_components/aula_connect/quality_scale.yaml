rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling:
    status: done
    comment: >-
      The data coordinator polls every 5 minutes; the calendar coordinator every 10 minutes,
      fetching birthdays daily and events, weekly plans and newsletters every 2 hours.
  brands:
    status: done
    comment: Its own icon and logo, shipped in brand/, which Home Assistant serves for custom integrations.
  common-modules: done
  config-flow-test-coverage:
    status: todo
    comment: The config flow has no tests.
  config-flow:
    status: todo
    comment: >-
      Setup is a config flow, but its fields have no data_description.
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: >-
      Calendars register with their coordinator in async_added_to_hass and unregister in
      async_will_remove_from_hass.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The flow completes the MitID login and only creates the entry with its tokens.
  test-before-setup:
    status: done
    comment: >-
      The first refresh checks the connection and raises ConfigEntryAuthFailed on refused
      credentials; other failures make setup retry.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no service actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options flow.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      Entities follow the coordinator's last update; the presence sensors are also unavailable
      without a daily overview for their child.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: The tests cover about 29% of the code; above 95% is required.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: A cloud service has nothing on the network to discover.
  discovery:
    status: exempt
    comment: A cloud service has nothing on the network to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration connects to the Aula service, not to devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: >-
      Entities for children are created at setup only; a child added to the account appears
      after a reload.
  entity-category:
    status: done
    comment: Every entity is primary data; none is configuration or diagnostic.
  entity-device-class:
    status: done
    comment: >-
      Sensors use the enum and duration device classes; no binary sensor device class fits an
      unread item.
  entity-disabled-by-default:
    status: todo
    comment: No entity is disabled by default, and which are rarely used has not been assessed.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: todo
    comment: Icons are set in code through _attr_icon; there is no icons.json.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Nothing the user must repair has been found; refused credentials start reauthentication.
  stale-devices:
    status: exempt
    comment: An entry is one device, which goes with the entry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: >-
      Each entry and each login gets a session of its own from async_create_clientsession, as
      Aula's and MitID's cookies are the login's.
  strict-typing: done
